<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Eden AI Hub</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0;
    }
    main { width: 100%; max-width: 360px; }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; background: #4f46e5;
      display: grid; place-items: center; animation: glow 3.6s ease-in-out infinite;
    }
    .logo svg { animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { 50% { box-shadow: 0 0 22px 4px rgba(99, 102, 241, .55); } }
    @media (prefers-reduced-motion: reduce) { .logo, .logo svg { animation: none; } }
    h1 { text-align: center; font-size: 22px; margin: 0 0 4px; }
    .lead { text-align: center; color: #94a3b8; font-size: 14px; margin: 0 0 24px; }
    label { display: block; font-size: 14px; margin: 14px 0 6px; color: #cbd5e1; }
    input {
      width: 100%; font-size: 17px; padding: 12px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #fff;
    }
    input:focus { outline: none; border-color: #6366f1; }
    #code { letter-spacing: 4px; text-transform: uppercase; font-family: ui-monospace, monospace; }
    button {
      width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 10px;
      background: #4f46e5; color: #fff; font-size: 16px; font-weight: 600;
    }
    button:disabled { opacity: .5; }
    .hint { font-size: 13px; color: #94a3b8; margin-top: 16px; line-height: 1.5; }
    #status { min-height: 20px; font-size: 14px; margin-top: 14px; text-align: center; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
      </svg>
    </div>
    <h1>Eden AI Hub</h1>
    <p class="lead">Connect to the hub running on your computer.</p>

    <form id="form">
      <label for="address">Hub address</label>
      <input id="address" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.153:3000" required />
      <label for="code">Pairing code</label>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="ABCD2345" required />
      <button id="go" type="submit">Connect</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="hint">
      Both are on your computer, in the hub under <b>Account → Connections → Your phone</b>.
      Your phone must be on the same Wi-Fi, and the hub must be running.
    </p>
  </main>

  <script>
    // Remembers the last hub, checks it is reachable, then opens it. The pairing code is sent once;
    // the hub then keeps this phone signed in with a cookie.
    const KEY = 'eden_hub';
    const form = document.getElementById('form');
    const address = document.getElementById('address');
    const code = document.getElementById('code');
    const go = document.getElementById('go');
    const status = document.getElementById('status');

    const normalise = (value) => {
      let v = value.trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
      if (!/:\d+$/.test(v.replace(/^https?:\/\//i, ''))) v += ':3000';
      return v;
    };

    const say = (text, isError) => {
      status.textContent = text;
      status.className = isError ? 'error' : '';
    };

    // Any answer at all (even "not paired") means the computer is reachable.
    const reachable = async (url) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        await fetch(url + '/api/pairing-check', { mode: 'no-cors', signal: controller.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
      }
    };

    const connect = async (url, pairCode) => {
      go.disabled = true;
      say('Connecting…');
      if (!(await reachable(url))) {
        go.disabled = false;
        say("Can't reach the hub. Check it is running on your computer and that this phone is on the same Wi-Fi.", true);
        return;
      }
      try { localStorage.setItem(KEY, JSON.stringify({ url, code: pairCode })); } catch {}
      window.location.href = url + '/?pair=' + encodeURIComponent(pairCode);
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      connect(normalise(address.value), code.value.trim().toUpperCase());
    });

    // Reopen the last hub straight away when the app starts.
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
    if (saved && saved.url) {
      address.value = saved.url.replace(/^http:\/\//, '');
      code.value = saved.code || '';
      if (!new URLSearchParams(location.search).has('setup')) connect(saved.url, saved.code || '');
    }
  </script>
</body>
</html>
